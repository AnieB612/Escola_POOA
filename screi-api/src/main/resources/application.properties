spring.application.name=api
server.port=8080

# Banco H2 em arquivo (os dados ficam em ./data). Troque por PostgreSQL/MySQL depois, se quiser.
spring.datasource.url=jdbc:h2:file:./data/api-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.open-in-view=false

# Não validar ao gravar no banco: rascunhos podem estar incompletos.
# A validação completa acontece no "enviar" (CadastroService.enviar).
spring.jpa.properties.jakarta.persistence.validation.mode=none
